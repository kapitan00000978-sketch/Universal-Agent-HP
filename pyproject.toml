[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent-hp"
version = "1.0.0"
description = "Universal Agent HP — Autonomous Cognitive AI Operating System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Universal Agent HP Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
# Laya runtimes are optional because upstream Laya pulls a substantial PyTorch stack,
# while Laya-MLX is supported only on Apple Silicon macOS.
laya = ["laya>=0.3.22"]
laya-mlx = ["laya-mlx>=0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
universal = "titan_agent.entrypoint:universal_cli"
universal-agent = "titan_agent.entrypoint:universal_cli"
titan-laya-decide = "titan_agent.laya_decisions:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["titan_agent*", "universal_agent*"]
